name: Deploy vault server to Cloudflare

# Deploys vault-viewer/server to the repo owner's Cloudflare account.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; skipped without them.
# Optional secret VAULT_ADMIN_PASSWORD sets the admin password (otherwise set it in the packer's
# server setup page right after the first deploy).

on:
  push:
    branches: [main]
    paths:
      - 'vault-viewer/server/**'
      - '.github/workflows/deploy-vault-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vault-viewer/server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VAULT_ADMIN_PASSWORD: ${{ secrets.VAULT_ADMIN_PASSWORD }}
    steps:
      - name: Check secrets
        id: check
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vault-viewer/server/package-lock.json
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npx tsc
      - if: steps.check.outputs.skip != 'true'
        run: npx wrangler deploy
      - if: steps.check.outputs.skip != 'true' && env.VAULT_ADMIN_PASSWORD != ''
        run: printf '%s' "$VAULT_ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
